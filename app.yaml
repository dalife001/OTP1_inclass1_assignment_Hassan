apiVersion: apps/v1
kind: Deployment
metadata:
  name: temperature-converter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temperature-converter
  template:
    metadata:
      labels:
        app: temperature-converter
    spec:
      containers:
        - name: temperature-converter
          image: temperature-converter:latest
          imagePullPolicy: Never
          env:
            - name: DISPLAY
              value: ":99"
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: temperature-converter
spec:
  selector:
    app: temperature-converter
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
