services:
  temperature-converter:
    image: temperature-converter:latest
    build:
      context: .
    environment:
      DISPLAY: "${DISPLAY:-host.docker.internal:0.0}"
      JAVA_TOOL_OPTIONS: "-Dprism.order=sw"
      LANG: ja_JP.UTF-8
      LANGUAGE: ja_JP:en_US:en
      LC_ALL: ja_JP.UTF-8
    extra_hosts:
      - "host.docker.internal:host-gateway"
